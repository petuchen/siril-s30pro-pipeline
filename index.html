<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S30 Pro Pipeline — README</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #f5f6fb;
    --surface: #ffffff;
    --surface-2: #fbfbfe;
    --text: #1c2033;
    --muted: #66697c;
    --accent: #4763ff;
    --accent-2: #7c6df2;
    --border: #e7e8f2;
    --radius-lg: 18px;
    --radius-md: 12px;
    --shadow: 0 2px 10px rgba(30,30,60,0.05), 0 1px 2px rgba(30,30,60,0.04);
    --c1: #4763ff;  /* processing stages */
    --c2: #14b8a6;  /* finishing stages */
    --c3: #f59e0b;  /* setup / prerequisites */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg); color: var(--text);
    font-family: "Inter","Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width: 1080px; margin: 0 auto; padding: 24px 16px 72px; }
  @media (min-width: 640px){ .wrap{ padding: 28px 20px 80px; } }

  header.top{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start; justify-content:space-between; margin-bottom: 20px; }
  .title-block h1{ font-size: 1.4rem; font-weight:800; margin:0 0 6px; letter-spacing:-0.01em; }
  @media (min-width: 640px){ .title-block h1{ font-size: 1.65rem; } }
  .title-block p.subtitle{ margin:0; color: var(--muted); font-size:0.92rem; max-width:640px; }

  .lang-toggle{ display:flex; background: var(--surface); border:1px solid var(--border); border-radius: 999px; padding:4px; box-shadow: var(--shadow); flex-shrink:0; }
  .lang-toggle button{ border:none; background:transparent; padding:10px 16px; border-radius:999px; font-weight:600; font-size:0.85rem; cursor:pointer; color:var(--muted); transition: all .15s ease; min-height:36px; }
  .lang-toggle button.active{ background: var(--accent); color:#fff; }

  .header-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; flex-shrink:0; }
  .btn-repo{ display:inline-flex; align-items:center; gap:8px; background: var(--text); color:#fff; text-decoration:none; padding:10px 16px; border-radius:999px; font-weight:600; font-size:0.85rem; box-shadow: var(--shadow); transition: all .15s ease; white-space:nowrap; }
  .btn-repo:hover{ background: var(--accent); }
  .btn-repo svg{ width:16px; height:16px; flex-shrink:0; }

  .hero-shot{ margin: 0 0 18px; border-radius: var(--radius-md); overflow:hidden; box-shadow: var(--shadow); border:1px solid var(--border); background:#141724; }
  .hero-shot img{ display:block; width:100%; height:auto; }
  .hero-shot figcaption{ padding:10px 14px; font-size:0.8rem; color:var(--muted); background: var(--surface); border-top:1px solid var(--border); }

  nav.tabs{ display:flex; gap:6px; overflow-x:auto; padding:6px 0 14px; -webkit-overflow-scrolling:touch; }
  nav.tabs::-webkit-scrollbar{ height:6px; }
  nav.tabs::-webkit-scrollbar-thumb{ background: var(--border); border-radius:4px; }
  nav.tabs button{ flex:0 0 auto; border:1px solid var(--border); background: var(--surface); color: var(--text); padding:10px 15px; border-radius: 999px; font-size:0.85rem; font-weight:600; cursor:pointer; white-space:nowrap; transition: all .15s ease; display:flex; align-items:center; gap:7px; min-height:40px; }
  nav.tabs button .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  nav.tabs button:hover{ border-color: var(--accent-2); }
  nav.tabs button.active{ background: var(--text); color:#fff; border-color:var(--text); }

  #content{ display:flex; flex-direction:column; }
  .panel{ display:none; }
  .panel.active{ display:block; animation: fade .2s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); margin-bottom:16px; }
  @media (min-width: 640px){ .card{ padding: 26px 28px; } }
  .card h2.topic-title{ font-size:1.2rem; font-weight:800; margin:0 0 4px; letter-spacing:-0.01em; }
  @media (min-width: 640px){ .card h2.topic-title{ font-size:1.35rem; } }
  .card h2.topic-title .badge{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:10px; }
  .card h3{ font-size:0.76rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--accent); font-weight:700; margin:18px 0 10px; }
  .card h3:first-child{ margin-top:0; }
  .card p{ margin:0 0 10px; color:var(--text); font-size:0.95rem; }
  .card p:last-child{ margin-bottom:0; }
  .card ul, .card ol{ margin:0 0 10px; padding-left:22px; font-size:0.95rem; }
  .card li{ margin-bottom:6px; }
  .card code{ background:#eef0fa; border:1px solid var(--border); border-radius:5px; padding:1px 6px; font-size:0.85em; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .card pre{ background:#141724; color:#dfe3f0; border-radius: var(--radius-md); padding:14px 16px; overflow-x:auto; font-size:0.82rem; line-height:1.55; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .card pre code{ background:transparent; border:none; padding:0; color:inherit; }

  .why{ background:#f2f7ff; border-left:4px solid var(--accent); border-radius:0 var(--radius-md) var(--radius-md) 0; padding:10px 14px; margin:0 0 12px; font-size:0.9rem; color:#2b3550; }
  .why b{ color: var(--accent); }

  table.tbl{ width:100%; border-collapse:collapse; font-size:0.88rem; margin:0 0 10px; }
  table.tbl th, table.tbl td{ border:1px solid var(--border); padding:8px 10px; text-align:left; vertical-align:top; }
  table.tbl th{ background: var(--surface-2); font-weight:700; }
  .tbl-scroll{ overflow-x:auto; }

  .steps{ counter-reset: step; list-style:none; padding-left:0 !important; }
  .steps > li{ position:relative; padding-left:44px; margin-bottom:14px; }
  .steps > li::before{ counter-increment: step; content: counter(step); position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:0.85rem; display:flex; align-items:center; justify-content:center; }
  .steps b.step-t{ display:block; margin-bottom:3px; }
  .tag{ display:inline-block; font-size:0.72rem; font-weight:700; border-radius:999px; padding:2px 10px; margin-left:8px; vertical-align:middle; }
  .tag.req{ background:#ffe4e6; color:#be123c; }
  .tag.rec{ background:#fef3c7; color:#b45309; }
  .tag.opt{ background:#e0f2fe; color:#0369a1; }

  details.refs{ border-top:1px solid var(--border); padding-top:14px; margin-top:14px; }
  details.refs summary{ cursor:pointer; font-weight:700; font-size:0.82rem; color:var(--muted); list-style:none; display:flex; align-items:center; gap:8px; user-select:none; }
  details.refs summary::-webkit-details-marker{ display:none; }
  details.refs summary::before{ content:"▸"; display:inline-block; transition: transform .15s ease; color:var(--accent); }
  details.refs[open] summary::before{ transform: rotate(90deg); }
  details.refs ol{ margin:12px 0 0; padding-left:20px; font-size:0.84rem; color:var(--muted); }
  details.refs a{ color: var(--accent); text-decoration:none; word-break:break-all; }
  details.refs a:hover{ text-decoration:underline; }

  .graph-hint{ font-size:0.82rem; color:var(--muted); text-align:center; margin:6px 0 0; }
  .graph-wrap{ width:100%; border:1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-2); overflow:auto; margin-top:14px; padding:6px; }
  #network-graph{ width:100%; height:auto; display:block; }
  .legend{ display:flex; flex-wrap:wrap; gap:12px; margin:14px 0 0; font-size:0.78rem; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .node-label{ font-size:10.5px; font-weight:700; fill:#fff; pointer-events:none; }
  .link{ stroke: #c7c9dd; stroke-width:1.6px; fill:none; }
  .node rect{ stroke:#fff; stroke-width:2px; cursor:pointer; }

  footer.foot{ text-align:center; color:var(--muted); font-size:0.76rem; margin-top:24px; }
</style>
</head>

<script>
/* ---------- UI chrome strings ---------- */
const UI = {
  en: {
    pageTitle: "S30 Pro Pipeline — README",
    pageSubtitle: "One-click astrophotography processing for smart telescopes, inside Siril. Nine guided stages, live before/after previews, undo everywhere.",

    pageSubtitle: "在 Siril 中一鍵完成智慧望遠鏡天文攝影後製。九個引導式步驟、即時前後對比預覽、每一步皆可復原。",
    downloadLink: "在 GitHub 下載",
    heroShotCaption: "每個步驟皆可即時前後對比、隨時復原——此為「移除背景」步驟的畫面。",
    footerNote: "S30 Pro Pipeline · GPL-3.0-or-later · 建基於 Naztronomy、GraXpert 與 VeraLux 的成果。圖表以 D3.js 繪製。",
    overviewTab: "總覽",
    references: "參考資料",
    graphHint: "整條處理流程（依序）— 點擊節點可跳到對應分頁。琥珀色＝一次性安裝設定，藍色＝影像處理，青色＝最後修飾。"
  }
};

/* ---------- Content ---------- */
const OVERVIEW = {
  summary:{
    en:`<p>A telescope doesn't take one pretty picture — it takes <b>hundreds of short, faint, noisy exposures</b> ("subs"). Processing is the craft of combining them and progressively cleaning the result. This script packages that whole craft into one window inside <a href="https://siril.org" target="_blank" rel="noopener">Siril</a>: stack &rarr; crop &rarr; remove sky glow &rarr; denoise &rarr; (optionally) remix into the Hubble palette &rarr; stretch the faint signal into view &rarr; fine-tune colors &rarr; polish like a phone photo &rarr; label what's in the frame.</p>
    <p>Every stage shows a draggable <b>before/after comparison</b>, has an <b>Undo</b> button, and can run alone or as part of <b>Run Full Pipeline</b>. All settings export to a JSON file you can share. It supports ZWO Seestar S30&nbsp;Pro / S30 / S50, Dwarf&nbsp;2/3/Mini, Celestron Origin and Unistellar scopes, and auto-detects yours from the file headers.</p>`,
    zh:`<p>望遠鏡拍的不是一張漂亮照片，而是<b>數百張短曝光、昏暗且充滿雜訊的影像</b>（稱為「子畫幅」）。後製就是把它們疊合、並逐步清理的工藝。本腳本把整套流程整合進 <a href="https://siril.org" target="_blank" rel="noopener">Siril</a> 的單一視窗：疊圖 → 裁切 → 去除天空光害 → 降噪 →（可選）混色成哈伯色盤 → 拉伸讓微弱訊號現形 → 微調色彩 → 像修手機照片般潤飾 → 標註畫面中的天體。</p>
    <p>每個步驟都有可拖曳的<b>前後對比</b>、<b>復原</b>按鈕，可單獨執行或以「Run Full Pipeline」一鍵完成。所有設定可匯出成 JSON 檔分享。支援 ZWO Seestar S30&nbsp;Pro / S30 / S50、Dwarf&nbsp;2/3/Mini、Celestron Origin 與 Unistellar 望遠鏡，並會從檔頭自動偵測型號。</p>`
  }
};

const TOPICS = [
{
  id:"prereq", cluster:"c3",
  title:{en:"Prerequisites", zh:"事前準備"},
  html:{
    en:`
    <h3>Do these once, in this order</h3>
    <ol class="steps">
      <li><b class="step-t">Install Siril <span class="tag req">required</span></b>
        The script runs <i>inside</i> Siril, the free astrophotography program. <b>Version 1.4 or newer</b> is required — older versions cannot run Python scripts. Download from <a href="https://siril.org/download/" target="_blank" rel="noopener">siril.org/download</a>. On macOS, right-click → Open on first launch to pass Gatekeeper.
      </li>
      <li><b class="step-t">Organize your files <span class="tag req">required</span></b>
        Create a session folder containing a <code>lights</code> sub-folder with your exposures. Optionally add <code>darks</code>, <code>flats</code>, <code>biases</code> folders for calibration frames.
        <pre><code>MySession/
├── lights/   ← your exposures (required)
├── darks/    ← cap-on exposures (removes sensor heat noise)
├── flats/    ← uniform-surface shots (removes dust &amp; vignetting)
└── biases/   ← shortest exposures (removes readout noise)</code></pre>
        <div class="why"><b>Why:</b> the stacker needs to know which file plays which role. On a Seestar, copy the contents of <code>MyWorks/&lt;target&gt;</code> into <code>lights/</code>.</div>
      </li>
      <li><b class="step-t">Install GraXpert &amp; download its AI models <span class="tag req">required for stages 5 &amp; 7</span></b>
        Install <a href="https://graxpert.com" target="_blank" rel="noopener">GraXpert</a>, open it once, load any image, and run <b>AI Background Extraction</b> and <b>Denoising</b> one time each so it downloads the model files (a few hundred MB). The pipeline then finds them automatically.
        <div class="why"><b>Why:</b> the neural-network models are large and license-restricted, so GraXpert itself must fetch them; the pipeline only runs them. No GraXpert? Stage 5 also offers Siril's built-in gradient removal — but AI denoise (stage 7) needs the model.</div>
      </li>
      <li><b class="step-t">Download the local Gaia star catalogs <span class="tag rec">recommended</span></b>
        Get both catalogs from <a href="https://siril.org/download/#catalogues" target="_blank" rel="noopener">siril.org</a> (astrometry = one file, photometry = a folder), then point Siril at them under <b>Preferences → Astrometry</b>. Stage 1 shows a live ✅/❌ status for each.
        <div class="why"><b>Why:</b> plate solving (knowing exactly where your image sits in the sky) needs the astrometry catalog — without it, mosaics fall back to simple star alignment. Color calibration (SPCC) uses the photometry catalog to match your stars against their true measured colors.</div>
      </li>
      <li><b class="step-t">Install StarNet++ <span class="tag opt">optional — star removal in stage 6</span></b>
        Download the <b>command-line</b> version from <a href="https://www.starnetastro.com/download/" target="_blank" rel="noopener">starnetastro.com</a> and unzip it somewhere permanent. On macOS, grant it permission in Terminal:
        <pre><code>cd /path/to/StarNetCLI
chmod +x starnet++ run_starnet.sh        # make executable
xattr -dr com.apple.quarantine .         # remove download quarantine</code></pre>
        Then set the path in Siril: <b>Preferences → Miscellaneous → StarNet executable</b>.
        <div class="why"><b>Why:</b> macOS blocks unsigned internet downloads until you clear the quarantine flag. StarNet lets the Hubble-palette stage recolor only the nebula and keep stars natural.</div>
      </li>
      <li><b class="step-t">Install local Astrometry.net / <code>solve-field</code> <span class="tag opt">optional — enables the plate-solve fallback, especially for Milky Way Mode</span></b>
        Preprocess's plate-solve step (used for SPCC and Annotate's WCS) already retries with a local Astrometry.net solve if Siril's own solver fails, and — for "Median (Milky Way Mode)" stacking specifically — retries once more with a full blind solve if that also fails. Neither fallback does anything without a local Astrometry.net install; without one, Siril just reports the failure and SPCC/Annotate get skipped for that run.
        <ol>
          <li>Install the solver: macOS (Homebrew) <code>brew install astrometry-net</code>; Windows — <a href="http://ansvr.astrometry.net/" target="_blank" rel="noopener">ansvr</a>; Linux — <code>sudo apt install astrometry.net</code> or your distro's package.</li>
          <li>Download index files matching your field of view from <a href="http://data.astrometry.net/" target="_blank" rel="noopener">data.astrometry.net</a> (rule of thumb: skymark size 10%–100% of your field width). Tele camera (~4.6° FOV): <code>index-4108</code>–<code>index-4114</code>. Wide/Milky Way camera (~60–70° FOV): <code>index-4116</code>–<code>index-4119</code> — the pipeline folder includes <code>download_wide_field_index.sh</code> to fetch and MD5-verify these four automatically.</li>
          <li>Confirm <code>solve-field</code>'s own config file — <code>astrometry.cfg</code>, e.g. <code>/opt/homebrew/etc/astrometry.cfg</code> on Apple Silicon Homebrew — has an <code>add_path</code> line pointing at your index-file folder. This is separate from Siril's own setting, which only locates the <code>solve-field</code> binary, not the index files.</li>
          <li>In Siril: <b>Preferences → Astrometry</b>, point the local Astrometry.net path at the <code>solve-field</code> binary's folder (e.g. <code>/opt/homebrew/bin</code> on Apple Silicon Homebrew).</li>
          <li>Sanity-check outside Siril first, for real diagnostics instead of Siril's one-line summary — run from a regular Terminal (not Siril's own command box; <code>solve-field</code> is an external program, not a Siril command):
            <pre><code>solve-field --scale-units degwidth --scale-low &lt;X&gt; --scale-high &lt;Y&gt; -v your_stacked.fits</code></pre>
            The verbose (<code>-v</code>) output lists exactly which index files loaded before it starts searching.
          </li>
        </ol>
        <div class="why"><b>Why:</b> Siril's own plate-solve algorithm sometimes fails on stacked Seestar images (even ones that solve fine on nova.astrometry.net), and reliably fails on Milky Way Mode's very wide stacked field using a header-hinted near-search. A local Astrometry.net install lets the pipeline's automatic fallbacks actually do something instead of just reporting the failure.</div>
      </li>
      <li><b class="step-t">Internet on first run <span class="tag opt">automatic</span></b>
        The first launch auto-installs Python libraries (PyQt6, NumPy, Astropy, OpenCV, ONNX Runtime) into Siril's environment — a few minutes, once.
      </li>
    </ol>`,
    zh:`
    <h3>只需做一次，請依順序完成</h3>
    <ol class="steps">
      <li><b class="step-t">安裝 Siril <span class="tag req">必要</span></b>
        腳本是在免費天文攝影軟體 Siril <i>裡面</i>執行的，需要 <b>1.4 以上版本</b>（舊版無法執行 Python 腳本）。請至 <a href="https://siril.org/download/" target="_blank" rel="noopener">siril.org/download</a> 下載。macOS 首次啟動請按右鍵 → 打開，以通過 Gatekeeper 檢查。
      </li>
      <li><b class="step-t">整理檔案 <span class="tag req">必要</span></b>
        建立一個拍攝資料夾，內含 <code>lights</code> 子資料夾放置曝光影像；校正幀資料夾 <code>darks</code>、<code>flats</code>、<code>biases</code> 為選用。
        <pre><code>MySession/
├── lights/   ← 你的曝光影像（必要）
├── darks/    ← 蓋上鏡頭蓋拍攝（消除感光元件熱雜訊）
├── flats/    ← 均勻面光源影像（消除灰塵陰影與暗角）
└── biases/   ← 最短曝光影像（消除讀出雜訊）</code></pre>
        <div class="why"><b>原因：</b>疊圖軟體必須知道每個檔案的用途。Seestar 使用者可將 <code>MyWorks/&lt;目標&gt;</code> 內的檔案複製到 <code>lights/</code>。</div>
      </li>
      <li><b class="step-t">安裝 GraXpert 並下載 AI 模型 <span class="tag req">第 5、7 步必要</span></b>
        安裝 <a href="https://graxpert.com" target="_blank" rel="noopener">GraXpert</a>，開啟一次並載入任意影像，各執行一次 <b>AI 背景抽取</b>與<b>降噪</b>，讓它下載模型檔（數百 MB）。之後本腳本會自動找到模型。
        <div class="why"><b>原因：</b>神經網路模型檔案龐大且有授權限制，必須由 GraXpert 本身下載，腳本只負責執行。沒有 GraXpert？第 5 步也提供 Siril 內建的梯度移除；但第 7 步的 AI 降噪必須有模型。</div>
      </li>
      <li><b class="step-t">下載本機 Gaia 星表 <span class="tag rec">強烈建議</span></b>
        從 <a href="https://siril.org/download/#catalogues" target="_blank" rel="noopener">siril.org</a> 下載兩個星表（天體測量＝單一檔案、測光＝資料夾），並在 Siril 的<b>偏好設定 → Astrometry</b> 中指定路徑。第 1 步驟卡片會即時顯示每個星表的 ✅/❌ 狀態。
        <div class="why"><b>原因：</b>「盤面解析」（precisely 知道影像對應天空的哪個位置）需要天體測量星表——沒有它，馬賽克拼接只能退回簡單的星點對齊。色彩校正（SPCC）則用測光星表，把你影像中的恆星與其真實測量顏色比對。</div>
      </li>
      <li><b class="step-t">安裝 StarNet++ <span class="tag opt">選用 — 第 6 步的移星功能</span></b>
        從 <a href="https://www.starnetastro.com/download/" target="_blank" rel="noopener">starnetastro.com</a> 下載<b>命令列版本</b>並解壓到固定位置。macOS 需在終端機授權：
        <pre><code>cd /path/to/StarNetCLI
chmod +x starnet++ run_starnet.sh        # 賦予執行權限
xattr -dr com.apple.quarantine .         # 移除下載隔離標記</code></pre>
        然後在 Siril 的<b>偏好設定 → 雜項 → StarNet 執行檔</b>中設定路徑。
        <div class="why"><b>原因：</b>macOS 會封鎖未簽章的網路下載程式，需清除隔離旗標。StarNet 讓哈伯色盤步驟只對星雲重新上色、保留恆星的自然色彩。</div>
      </li>
      <li><b class="step-t">安裝本機 Astrometry.net／<code>solve-field</code> <span class="tag opt">選用 — 啟用板解算備援，對銀河模式尤其重要</span></b>
        前置處理的板解算步驟（供 SPCC 及標註步驟的天體測量座標使用）在 Siril 自身解算器失敗時，已會自動重試一次本機 Astrometry.net 解算；若選用「Median (Milky Way Mode)」疊圖方式，且該次也失敗，還會再重試一次完全盲解算。這兩層備援若沒有安裝本機 Astrometry.net 都無法發揮作用——沒裝的話，Siril 只會回報失敗，該次執行的 SPCC／標註就會被跳過。
        <ol>
          <li>安裝解算器：macOS（Homebrew）執行 <code>brew install astrometry-net</code>；Windows 安裝 <a href="http://ansvr.astrometry.net/" target="_blank" rel="noopener">ansvr</a>；Linux 執行 <code>sudo apt install astrometry.net</code> 或所用發行版對應的套件。</li>
          <li>從 <a href="http://data.astrometry.net/" target="_blank" rel="noopener">data.astrometry.net</a> 下載符合你視野大小的索引檔（經驗法則：星標尺寸約為視野寬度的 10%–100%）。主鏡頭相機（視野約 4.6°）：<code>index-4108</code>–<code>index-4114</code>。廣角／銀河相機（視野約 60–70°）：<code>index-4116</code>–<code>index-4119</code>——本專案資料夾內附的 <code>download_wide_field_index.sh</code> 可自動下載並以 MD5 驗證這四個檔案。</li>
          <li>確認 <code>solve-field</code> 自身的設定檔——<code>astrometry.cfg</code>（例如 Apple Silicon Homebrew 上的 <code>/opt/homebrew/etc/astrometry.cfg</code>）——內含指向索引檔資料夾的 <code>add_path</code> 那一行。這與 Siril 本身的設定是分開的，Siril 的設定只用來定位 <code>solve-field</code> 執行檔本身，並不知道索引檔放在哪裡。</li>
          <li>在 Siril 中：<b>偏好設定 → Astrometry</b>，將本機 Astrometry.net 路徑指向 <code>solve-field</code> 執行檔所在資料夾（例如 Apple Silicon Homebrew 上的 <code>/opt/homebrew/bin</code>）。</li>
          <li>建議先在 Siril 之外做一次檢查，可看到比 Siril 單行摘要更完整的診斷資訊——請在一般終端機（而非 Siril 自身的指令欄，<code>solve-field</code> 是外部程式、不是 Siril 指令）執行：
            <pre><code>solve-field --scale-units degwidth --scale-low &lt;X&gt; --scale-high &lt;Y&gt; -v your_stacked.fits</code></pre>
            加上 <code>-v</code> 的詳細輸出會在開始搜尋前，列出實際載入了哪些索引檔。
          </li>
        </ol>
        <div class="why"><b>原因：</b>Siril 自身的板解算演算法有時會在堆疊後的 Seestar 影像上失敗（即使同一張影像在 nova.astrometry.net 上可順利解算），而在銀河模式極寬廣的堆疊視野上，使用標頭提示的鄰近搜尋幾乎必定失敗。安裝本機 Astrometry.net 後，管線內建的自動備援機制才真正有作用，而不只是回報失敗。</div>
      </li>
      <li><b class="step-t">首次執行需要網路 <span class="tag opt">自動</span></b>
        第一次啟動會自動安裝 Python 函式庫（PyQt6、NumPy、Astropy、OpenCV、ONNX Runtime），約需數分鐘，僅此一次。
      </li>
    </ol>`

    en:`
    <h3>Installing the script</h3>
    <div class="why"><b>Since v1.43.0:</b> the script is split into <code>S30Pro_Pipeline.py</code> plus a <code>s30pro_pipeline/</code> helper-module folder that must sit right next to it. Always copy both together.</div>
    <p><b>Option A — Scripts menu (recommended).</b> Copy <code>S30Pro_Pipeline.py</code> <b>and</b> the <code>s30pro_pipeline/</code> folder into Siril's scripts folder, then restart Siril; it appears in the <b>Scripts</b> menu.</p>
    <div class="tbl-scroll"><table class="tbl">
      <tr><th>OS</th><th>Scripts folder</th></tr>
      <tr><td>macOS</td><td><code>~/Library/Application Support/org.free-astro.Siril/scripts</code></td></tr>
      <tr><td>Windows</td><td><code>%LOCALAPPDATA%\\siril\\scripts</code></td></tr>
      <tr><td>Linux</td><td><code>~/.local/share/siril/scripts</code></td></tr>
    </table></div>
    <p>You can also add any folder of your choice under <b>Preferences → Scripts</b> and press the refresh icon.</p>
    <p><b>Option B — no install.</b> In Siril's command line: <code>pyscript /path/to/S30Pro_Pipeline.py</code></p>
    <h3>Quick start</h3>
    <ol>
      <li>Set Siril's working directory to your session folder (the one <i>containing</i> <code>lights/</code>) — or just launch the script, it will ask.</li>
      <li>Launch <b>S30Pro_Pipeline</b> from the Scripts menu. Your telescope is auto-detected from the file headers.</li>
      <li>Review the stage cards; sensible defaults are pre-ticked. Optional stages (palette, histogram, final touch, watermark) are off by default.</li>
      <li>Press <b>▶ Run Full Pipeline</b>, or run stage by stage and inspect each result with the draggable before/after divider.</li>
      <li>Finished files land in your session folder: <code>*_stacked</code>, <code>final_stretched_*</code>, <code>final_touched_*</code>.</li>
    </ol>
    <div class="why"><b>Tip:</b> <b>⤓ Export settings</b> saves every knob to JSON. Keep one preset per target type (galaxy / nebula / Hubble palette) and re-import anytime.</div>`,

  id:"stages", cluster:"c1",
  title:{en:"The 13 Stages Explained", zh:"十三大步驟解說"},
  html:{
    en:`
    <h3>What each stage does — and why it exists</h3>
    <p><b>1 · Preprocess (stacking).</b> Aligns and averages hundreds of subs into one deep image, then calibrates colors against real star measurements (SPCC). A collapsible "Combine with an existing master" section can also merge this run's fresh stack with an already-stacked FITS from an earlier session that has no raw subs — registered against it and combined with Siril's <code>-weight=nbstack</code>, weighted by each session's <code>STACKCNT</code> header (with a manual override for masters that don't have one) instead of averaging two very different amounts of integration time 50/50. The combined result's total integration time (and the auto-saved "..._combined" filename) reflects the true sum of both sessions' subs, not just what Siril's own 2-frame stack would otherwise report.
    <div class="why"><b>Why:</b> one 10-second exposure is faint and grainy. Averaging 300 of them behaves like a 50-minute exposure: the signal adds up while random noise cancels out. Options: calibration frames, drizzle (finer sampling), feathering for mosaics, quality-weighted stacking, FITS compression.</div></p>
    <p><b>2 · Crop.</b> Optionally rotates the image first (slider + degree number input, -180° to 180°), then trims 5% (or custom margins) off each edge.
    <div class="why"><b>Why:</b> the telescope drifts slightly between shots, so stacked edges are ragged. Rotating lets you square the frame up before trimming it.</div></p>
    <p><b>3 · Remove Green (SCNR).</b> Removes the green color cast with Siril's <code>rmgreen</code>.
    <div class="why"><b>Why:</b> color sensors tend to produce a greenish sky that isn't physically there — almost nothing in deep space glows green.</div></p>
    <p><b>4 · Auto Gradient Removal.</b> A built-in port of the standalone AutoGradientRemoval script: an iterative, robust background/gradient estimator with adjustable Scale, Smoothness, Downsample, correction Mode (subtract/divide), structure Protection (threshold + amount, to keep it from fitting away stars/nebulae), and an optional Simplified polynomial model with its own Degree.
    <div class="why"><b>Why:</b> gives a second, independently tunable gradient-flattening pass — useful on its own, or as a milder pre-pass ahead of stage 5's heavier background removal for wide, uneven sky glow.</div></p>
    <p><b>5 · Remove background.</b> Flattens sky glow using GraXpert's AI, or Siril's built-in <code>subsky</code> (RBF / polynomial) if you prefer no AI. For Siril subsky, a "Preview &amp; edit sample boxes..." button opens an interactive canvas over the current image with an editable grid of sample boxes (green = kept, red = excluded) — click to toggle, click empty space to add, or Regenerate/Select All/Deselect All — and the kept boxes are pushed into Siril before <code>subsky</code> runs.
    <div class="why"><b>Why:</b> light pollution and moonlight make one corner of the sky brighter than another. Removing this gradient lets the real object stand out. Hand-curated sample boxes help when automatic placement lands on stars or nebulosity instead of clean background.</div></p>
    <p><b>6 · Remove Stars.</b> Separates stars from the rest of the image using StarNet, so later stages can work on nebulosity alone.
    <div class="why"><b>Why:</b> lets stage 8's Hubble palette recolor nebulosity without also recoloring the stars.</div></p>
    <p><b>7 · Denoise.</b> GraXpert's neural network smooths grain while keeping stars and structure, with a strength blend.
    <div class="why"><b>Why:</b> even after stacking, faint regions stay noisy. The AI has learned what sensor noise looks like versus real detail.</div></p>
    <p><b>8 · Hubble palette (optional).</b> For dual-band-filter shots of emission nebulae: extracts the hydrogen signal (red channel) and oxygen signal (green+blue), then remixes them into false-color presets — including a blue-highlights mix — with optional StarNet star protection so stars keep natural colors. Also has an optional "GIMP replacement polish" section (collapsed by default — click to expand) — Saturation, Shadows, Highlights, Contrast, Sharpen, Denoise, each independently tunable and off by default — folding the same Colors/Filters adjustments from a manual GIMP finishing pass (<code>gimp_replacement.py</code>) into one repeatable step, run after whichever recolor mode you picked.
    <div class="why"><b>Why:</b> nebula gases glow at precise wavelengths. Remapping them reveals structure your eyes could never see — this is how the iconic gold-and-teal NASA images are made. A color camera has no real sulfur channel, so "SHO" here is synthetic. Turn SPCC off in stage 1 when using this. The GIMP replacement polish exists because that same tutorial's next step was a manual round-trip through GIMP (Colors ▸ Saturation, Colors ▸ Shadows-Highlights, Colors ▸ Brightness-Contrast, Filters ▸ Enhance ▸ Sharpen/Noise Reduction) — this makes that finishing touch a one-click, repeatable part of the pipeline instead.</div></p>
    <p><b>9 · Stretch (VeraLux).</b> Lifts the image from nearly black to visible using an inverse hyperbolic stretch that preserves color ratios; includes an auto-solver for the key "Log D" strength parameter.
    <div class="why"><b>Why:</b> cameras record light linearly, but deep-sky objects are ~1000× fainter than a screen can show. Naive brightening shifts colors and clips stars; VeraLux stretches luminance while protecting the color vectors.</div></p>
    <p><b>10 · Histogram fine-tune.</b> An interactive histogram with three draggable points (shadows / midtones / highlights), per channel (RGB, R, G, B), with real-time preview.
    <div class="why"><b>Why:</b> after the big stretch, small per-color corrections fix residual casts and set the final black point — the difference between "okay" and "wow".</div></p>
    <p><b>11 · Final touch.</b> Phone-style brightness, contrast, saturation and sharpening sliders with live preview.
    <div class="why"><b>Why:</b> the familiar last-mile polish, applied at full resolution only when you commit.</div></p>
    <p><b>12 · Annotate.</b> Labels stars and deep-sky objects on the plate-solved field. Stars come from Siril's own <code>conesearch</code> (local Bright Star Catalogue, or the online BSC). Messier/NGC/IC come from the OpenNGC database (downloaded once, cached locally). Sharpless and Lynds Dark Nebulae come from live VizieR cone searches. Each catalog has its own checkbox and annotation color; a "Select objects to show..." dialog lets you tick/untick individual objects with the preview updating instantly, and Undo / "Save annotated image..." / a one-click "Remove all annotations" button (mirroring Watermark's clear-all) are all available. Object markers are sized to the object's real apparent diameter (from each catalog's size field, converted through the plate solve's pixel scale) rather than a fixed circle, and label text is placed by a layout pass that avoids overlapping other labels and never lets a label get cut off at the image edge.
    <div class="why"><b>Why:</b> turns a plate-solved frame into a labeled reference view. This replaces the 1.18–1.24 approach of scraping Siril's <code>catsearch</code> console log, which had no documented, stable output format and never resolved reliably; 1.25 removed the stage entirely, and this rebuild sources catalog data independently instead. Real-size markers make a wide diffuse target like North America Nebula visually distinct from a small planetary nebula at a glance, and the label layout keeps crowded fields (a rich Messier region, a dense star field) readable instead of a pile of overlapping text.</div></p>
    <p><b>13 · Watermark.</b> Draws a semi-transparent info block onto the image — object name, date, telescope, integration time, FOV, image size, Bortle estimate, plus an optional free-text "Author" credit line you type yourself — with position, opacity, and one/two-column layout controls.
    <div class="why"><b>Why:</b> keeps your attribution and shot details attached to a photo once it leaves the folder it was processed in — the FITS data itself is left untouched.</div></p>
    <p style="margin-top:1em"><i>Every stage also has a small "Use Siril's image" button in its header that refreshes that stage's preview from whatever is currently loaded in Siril — for continuing work that happened outside the pipeline (e.g. manual Siril commands, another script).</i></p>`,
    zh:`
    <h3>每個步驟做什麼——以及為什麼需要它</h3>
    <p><b>1 · 前置處理（疊圖）。</b>將數百張子畫幅對齊並平均成一張深度影像，再以真實恆星測量值校正色彩（SPCC）。另有可收合的「與現有主影像合併」區塊，可將本次疊圖結果與先前工作階段中已疊好、但未保留原始子畫幅的 FITS 檔案合併——會先與該檔案對齊，再以 Siril 的 <code>-weight=nbstack</code> 依各工作階段的 <code>STACKCNT</code> 標頭加權合併（若該檔案沒有此標頭，可手動輸入子畫幅張數覆寫），而不是把兩個累積曝光時間差異懸殊的資料簡單地各半平均。合併結果的總曝光時間（以及自動儲存時使用的「..._combined」檔名）會反映兩個工作階段子畫幅的真實總和，而非 Siril 兩張影像疊圖時本身會回報的數字。
    <div class="why"><b>原因：</b>單張 10 秒曝光既暗又粗糙。把 300 張平均起來，效果如同曝光 50 分鐘：訊號累加、隨機雜訊互相抵消。選項包括：校正幀、drizzle（更細取樣）、馬賽克羽化、品質加權疊圖、FITS 壓縮。</div></p>
    <p><b>2 · 裁切。</b>可先用滑桿＋角度數字輸入（-180° 至 180°）旋轉影像，再裁掉四邊各 5%（或自訂邊距）。
    <div class="why"><b>原因：</b>望遠鏡在拍攝間會些微漂移，疊出的邊緣參差不齊。先旋轉可在裁切前把畫面擺正。</div></p>
    <p><b>3 · 去除綠色（SCNR）。</b>用 Siril 的 <code>rmgreen</code> 去除綠色色偏。
    <div class="why"><b>原因：</b>彩色感光元件常產生實際不存在的綠色天空——深空幾乎沒有東西發綠光。</div></p>
    <p><b>4 · 自動去梯度。</b>內建移植自獨立 AutoGradientRemoval 腳本的疊代式穩健背景／漸層估計器，可調整 Scale（尺度）、Smoothness（平滑度）、Downsample（降取樣）、校正 Mode（相減／相除）、結構保護（門檻與強度，避免星點或星雲被誤判為背景），以及選用的簡化多項式模型（附獨立 Degree 次數設定）。
    <div class="why"><b>原因：</b>提供第二道可獨立調整的去漸層處理——可單獨使用，也可作為第 5 步較重度去背景之前的溫和前處理，適合大範圍不均勻的天空輝光。</div></p>
    <p><b>5 · 移除背景。</b>用 GraXpert 的 AI 抹平天空輝光；不想用 AI 也可選 Siril 內建的 <code>subsky</code>（RBF／多項式）。使用 Siril subsky 時，「預覽並編輯取樣框...」按鈕會在目前影像上開啟互動式畫布，顯示可編輯的取樣框網格（綠色＝保留、紅色＝排除）——點擊取樣框可切換保留狀態，點擊空白處可新增，也可重新產生預設網格／全選／全部取消；確認後的取樣框會在執行 <code>subsky</code> 前送入 Siril。
    <div class="why"><b>原因：</b>光害與月光讓天空一角比另一角亮。移除這種漸層，真正的天體才能突顯出來。當自動配置的取樣框落在星點或星雲上而非乾淨背景時，手動精選取樣框特別有幫助。</div></p>
    <p><b>6 · 移除星點。</b>用 StarNet 將星點與影像其餘部分分離，讓後續步驟可單獨處理星雲本體。
    <div class="why"><b>原因：</b>讓第 8 步的哈伯色盤只重新上色星雲，不會連帶影響星點的顏色。</div></p>
    <p><b>7 · 降噪。</b>GraXpert 神經網路在保留星點與細節的同時撫平顆粒感，可調強度混合。
    <div class="why"><b>原因：</b>即使疊圖之後，暗部仍有雜訊。AI 已學會分辨感光元件雜訊與真實細節。</div></p>
    <p><b>8 · 哈伯色盤（選用）。</b>針對使用雙窄帶濾鏡拍攝的發射星雲：抽取氫訊號（紅色通道）與氧訊號（綠＋藍），重新混合成偽色預設——包括突顯藍色的配方——並可選 StarNet 移星保護，讓恆星保持自然色彩。另有選用的「GIMP 替代潤飾」區塊（預設收合——點擊可展開）——飽和度、陰影、亮部、對比、銳化、降噪，各自獨立可調，預設全部關閉——將手動 GIMP 潤飾步驟中相同的 Colors／Filters 調整（<code>gimp_replacement.py</code>）整合成單一可重複執行的步驟，在你選擇的重新上色模式之後套用。
    <div class="why"><b>原因：</b>星雲氣體在特定波長發光，重新映射能揭露肉眼永遠看不到的結構——標誌性的金色與青色 NASA 影像正是這樣做出來的。彩色相機沒有真正的硫通道，這裡的「SHO」是合成的。使用此步驟時請關閉第 1 步的 SPCC。</div></p>
    <p><b>9 · 拉伸（VeraLux）。</b>以保留色彩比例的反雙曲拉伸，把影像從幾乎全黑提升到可見，並內建關鍵參數「Log D」的自動求解器。
    <div class="why"><b>原因：</b>相機以線性方式記錄光線，但深空天體比螢幕能顯示的暗上千倍。粗暴增亮會偏色並讓星點過曝；VeraLux 只拉伸亮度、同時保護色彩向量。</div></p>
    <p><b>10 · 直方圖微調。</b>互動式直方圖，三個可拖曳控制點（陰影／中間調／亮部），可分別調整 RGB、R、G、B 通道，即時預覽。
    <div class="why"><b>原因：</b>大拉伸之後，細微的各色修正能消除殘餘色偏並定好最終黑點——這是「還可以」與「驚豔」的差別。</div></p>
    <p><b>11 · 最後修飾。</b>手機修圖式的亮度、對比、飽和度與銳化滑桿，即時預覽。
    <div class="why"><b>原因：</b>熟悉的最後一哩潤飾，確認後才以全解析度套用。</div></p>
    <p><b>12 · 標註。</b>在已完成天體測量解析的影像上標示恆星與深空天體。恆星資料來自 Siril 自身的 <code>conesearch</code>（本地明亮星表，或線上 BSC）。Messier／NGC／IC 來自 OpenNGC 資料庫（僅下載一次並快取於本機）。Sharpless 與 Lynds 暗星雲則來自即時的 VizieR 錐形搜尋。每個星表都有各自的核取方塊與標註顏色；「選擇要顯示的天體...」對話框可逐一勾選／取消天體，預覽即時更新，並提供還原、「儲存已標註影像...」，以及與浮水印步驟相同、可一鍵清除全部標註的「移除全部標註」按鈕。標記圓圈現在會依天體的實際視直徑（透過解析後的像素比例換算各星表的尺寸欄位）繪製，不再是固定大小；文字標籤則經過版面配置演算法安排，會避免互相重疊，也保證絕不會被影像邊緣裁切。
    <div class="why"><b>原因：</b>把完成天體測量解析的影像變成可標示的參考圖。此功能取代了 1.18–1.24 版本中解析 Siril <code>catsearch</code> 主控台紀錄的做法——該做法沒有固定文件化的輸出格式，始終無法穩定運作；1.25 版曾完全移除此步驟，本版改為獨立取得星表資料重新建構。依實際大小繪製標記，能讓北美星雲這類大範圍瀰漫天體與行星狀星雲等小天體一眼區分；而智慧文字版面配置能讓密集星場或天體聚集的區域維持可讀，不再是一堆疊在一起的文字。</div></p>
    <p><b>13 · 浮水印。</b>在影像上疊加半透明資訊區塊——目標名稱、日期、望遠鏡、累積曝光時間、視場、影像尺寸、Bortle 估計值，並可自行輸入「Author」署名欄位——並可調整位置、透明度與單／雙欄版面。
    <div class="why"><b>原因：</b>讓照片離開處理資料夾後，仍保留署名與拍攝資訊——原始 FITS 資料完全不會被修改。</div></p>
    <p style="margin-top:1em"><i>每個步驟的標題列也都有一個小小的「使用 Siril 目前影像」按鈕，可將該步驟的預覽重新整理為 Siril 目前載入的影像——方便接續在管線之外進行的操作（例如手動下達 Siril 指令，或執行其他腳本）。</i></p>`

    <h3>Common issues</h3>
    <div class="tbl-scroll"><table class="tbl">
      <tr><th>Symptom</th><th>Fix</th></tr>
      <tr><td>Script not in the Scripts menu</td><td>Siril must be ≥ 1.4; check the folder is listed under Preferences → Scripts; rescan or restart. File must end in <code>.py</code>.</td></tr>
      <tr><td>"No GraXpert model found"</td><td>Open GraXpert once and run AI background extraction + denoising so it downloads its models (Prerequisites step 3).</td></tr>
      <tr><td>"StarNet failed"</td><td>Check permissions (macOS <code>chmod</code> / <code>xattr</code>) and the executable path in Preferences → Miscellaneous (Prerequisites step 5).</td></tr>
      <tr><td>Gaia status shows ❌</td><td>Download the catalogs and set both paths in Preferences → Astrometry (Prerequisites step 4).</td></tr>
      <tr><td>First run is very slow</td><td>Python dependencies are installing — one time only.</td></tr>
      <tr><td>Mosaic panels misaligned</td><td>The astrometry Gaia catalog is missing; without it the script falls back to simple star registration.</td></tr>
      <tr><td>Palette output looks flat / colorless</td><td>The target must be an emission nebula shot with the LP / dual-band filter; galaxies and star clusters won't respond.</td></tr>
      <tr><td>"Astrometry.net fallback also failed" / log mentions <code>-localasnet</code></td><td>Local Astrometry.net isn't installed, or has no index files for your field — see Prerequisites step 6.</td></tr>
      <tr><td>Stacked image still won't plate-solve even with <code>-localasnet</code></td><td>Confirm <code>astrometry.cfg</code>'s <code>add_path</code> actually points at your index-file folder (Prerequisites step 6.3) — Siril's own "path" setting only locates the <code>solve-field</code> binary, not the indexes.</td></tr>
      <tr><td>"Plate Solving failed. The image could not be aligned with the reference stars" on a Milky Way Mode stack</td><td>Very wide (~60–70°) fields usually need the wide-field index files (<code>download_wide_field_index.sh</code>) plus a full blind solve — the pipeline already retries this automatically (1.41.0) as a last resort, but the index files still need to be installed for it to succeed.</td></tr>

    <h3>Full version history</h3>
    <p>The script's own docstring only keeps a short summary of the last
    few releases so the file stays skimmable. The full, detailed history

    <table class="fields"><tr><th>Version</th><th>Highlights</th></tr>

        could skip a step after picking colors — the dialog's
        checkpoint-based undo stack recorded its snapshot right
        <i>before</i> a picked Marker/Cross/Text color was applied
        instead of after (every other field in that dialog checkpoints
        after its value changes), so a second color pick in the same
        session could silently drop the in-between state from the undo

      <tr><td>1.49.0</td><td>新功能：<b>個別物件的標註樣式覆寫</b>。「Select objects to show...（選擇要顯示的物件）」對話框中，每一列現在都新增一個 🎨 按鈕，可開啟一個小編輯視窗，只針對該單一物件調整——標記樣式、圓圈／十字的顏色與粗細、十字的間隙／臂長／標籤位置／標籤距離，以及該標籤自己的文字內容——完全獨立於「Annotation style（標註樣式）」面板，其他物件仍會照常套用該面板的設定。修改會立即套用到即時預覽，編輯視窗內的「Reset to panel default（還原為面板預設值）」按鈕可捨棄覆寫，重新依目前面板設定計算出該物件的樣式。取消「Select objects to show...」對話框現在也會一併還原個別物件的樣式修改，而不只是還原顯示／隱藏的勾選狀態。與「Select objects to show...」的其他功能一樣，這些覆寫僅是執行後、匯出前的預覽調整——重新執行標註步驟時，每個物件都會依照面板預設值重新產生。</td></tr>

      <tr><td>1.47.0</td><td>標註步驟的物件名稱現在可以顯示更多資訊。新增「Label detail（標籤詳細資訊）」設定區塊，提供四個取自 OpenNGC 星表的選用欄位——天體類型、星等、所屬星座、視大小——各自獨立勾選；另外新增「Custom lines（自訂內容）」清單，可自行輸入額外文字（雙擊即可編輯，並可用 Add／Remove 新增或移除）。每一項啟用的內容都會顯示在物件名稱下方各自一行，並依標籤所在的方向（在標記的左側或右側）自動靠左或靠右對齊，讓多行標籤仍然清楚「附著」在對應的標記上。若使用開放式十字（Open Cross）樣式，標籤所在那一側的南／北臂會隨行數增加自動加長，向外延伸至貼近較高的標籤區塊。以上設定皆會隨匯出／匯入設定一併儲存與還原。</td></tr>
      <tr><td>1.46.0</td><td>標註步驟新增「Marker style（標記樣式）」選項——圓圈（原本預設，行為不變）、<b>開放式十字（Open Cross）</b>（由 4 段短線組成的準星，兩端都在碰到物體前停下，不會像圓圈那樣蓋住物體本身），或兩者同時顯示——圓圈與十字各自擁有獨立的粗細與顏色設定（粗細可自動或指定像素值；顏色預設沿用各星表原本的顏色，也可切換成單一自訂顏色覆蓋）。十字的中心間隙與臂長皆以標記自身半徑的倍數設定，因此會隨每個天體的視大小自動縮放。由於開放式十字會讓四個對角方向保持淨空，因此新增「Label position（名稱位置）」選項（NE／NW／SE／SW，或 Auto），可指定既有的防重疊排版優先選用哪個角落。以上設定皆會隨匯出／匯入設定一併儲存與還原。</td></tr>
      <tr><td>1.45.0</td><td>新功能：<b>彗星堆疊（Comet Stack）</b>模式，是「前處理」堆疊方式下拉選單中新增的第四個選項，專為彗星與小行星目標設計。它會用同一批子圖產生兩張堆疊結果——一張以恆星對齊（彗星拖出尾跡），一張以彗星自身移動對齊（恆星拖線、彗星銳利）——因為移動天體需要兩種不同的對齊方式，這是其他堆疊模式都做不到的，然後把兩者交給「星點重組（Star Recomposition）」合成一張兩者皆銳利的影像。過程中有一個技術細節需要手動解決：<code>seqstarnet</code> 會重新產生它輸出序列的 .seq 檔，而不會保留 Siril 先前已算好的對齊資料；由於沒有對應的主控台指令可以把它接回去，因此新增了 <code>_splice_seq_registration()</code> 輔助函式，直接以文字檔案的方式把對齊資料補回去（並附有專屬單元測試）。選擇此模式時會出現新的設定區塊，可調整堆疊拒斥的 sigma 值與背景移除的階數／取樣點數，同時會自動關閉（並以提示說明灰化）下方的「移除背景」與「移除星點」兩個步驟（彗星堆疊本身的流程已經包含這兩者），切換回其他堆疊方式時會還原原本的勾選狀態。有兩個步驟無法用指令自動化，會暫停流程並顯示畫面說明與「繼續」按鈕：在 Siril 自己的「彗星／小行星對齊」工具中手動框選彗核，以及手動執行「星點重組」（影像處理 → 星點處理）。完成後，後續的拉伸、直方圖、最終潤飾、標註、浮水印等步驟會照常在合成結果上執行，不受影響。</td></tr>

      <tr><td>1.43.0</td><td>內部重構，行為不變：將原本 8,862 行的單一腳本拆分為 <code>S30Pro_Pipeline.py</code> 加上新的 <code>s30pro_pipeline/</code> 套件，裡面放置與主視窗 Qt 狀態無關、可獨立存在的部分（VeraLux 拉伸核心、GraXpert 輔助函式、自動漸層移除演算法、樣式表、共用常數、Bortle 估算、星表／星座資料、可重複使用的 UI 元件）。主腳本現在約 6,970 行。已在拆分前後分別以完整的 87 項測試驗證。安裝時請務必連同新資料夾一併複製——見上方「安裝」章節。</td></tr>
      <tr><td>1.42.0</td><td>標註步驟的星座連線與星座名稱現在可各自設定顏色——分別提供「Line color...」與「Name color...」兩個選色按鈕，不再共用同一種顏色——並新增「Color preset」下拉選單，內含六組精選的搭配色（淡薰衣草紫、天空藍、暖金色、經典白、柔和紅、柔和綠）可直接套用。選擇預設集會同時套用連線與名稱兩種顏色；之後手動選色會自動將下拉選單切回「Custom」。兩種顏色皆會隨匯出／匯入設定一併儲存與還原。</td></tr>
      <tr><td>1.41.0</td><td>銀河模式（Milky Way Mode）的 SPCC 板解算步驟現在會再多一層備援：如果一般的 <code>-localasnet</code>（1.40.0 新增）也失敗，會再重試一次 <code>-blindpos -blindres</code>（完全盲解算）後才放棄——經實測確認，約 60-70 度的寬廣堆疊視野即使已安裝正確的索引檔，仍經常需要完全盲解算才能成功，帶有標頭提示的鄰近搜尋並不可靠。此步驟只會在最終堆疊影像上執行一次，不會逐張套用於原始畫幅。</td></tr>
      <tr><td>1.40.0</td><td>修正堆疊後的 Seestar 影像持續無法板解算的問題（後續執行標註時出現「No valid plate-solve solution in the image header」），即使同一張影像在 nova.astrometry.net 上可以順利解算成功。前置處理的 SPCC 板解算步驟現在會在 Siril 自身解算器失敗時，自動重試一次 <code>-localasnet</code>（本機 Astrometry.net 的 solve-field）後才放棄——需要在本機安裝 Astrometry.net（Windows 上為 ansvr，Mac 上可用 <code>brew install astrometry-net</code>）並具備涵蓋該視野的索引檔；若未安裝，備援同樣會失敗，SPCC／標註會如先前一樣被跳過，並在記錄中說明原因。另外：選用「Median (Milky Way Mode)」疊圖方式時，所有板解算呼叫現在都會帶入廣角相機真實的光學參數（焦距 6mm、有效像元尺寸約 1.7 微米），而不是完全信任影像標頭——部分韌體版本會把主鏡頭相機的數值（160mm／2.9 微米）誤寫入廣角相機的 FITS 標頭，光是這樣就足以導致解算失敗。</td></tr>

      <tr><td>1.38.0</td><td>底部的 4 個按鈕（儲存檔案／匯出設定／重設／關閉管線）現在改為兩列、每列 2 個，取代原本一列 4 個的排列，讓左側面板不會過寬。按鈕順序不變。</td></tr>
      <tr><td>1.37.0</td><td>標註：新增「星座連線」選項，會為視野內（哪怕只是部分涵蓋）的 88 個國際天文聯合會（IAU）星座，在亮星之間繪製連線圖形，並可選擇顯示星座名稱——連線資料完全內建於腳本中，離線可用，不需網路或快取，與上方的梅西耶／NGC／Sharpless 星表不同。可調整線條寬度、顏色、與星星保持的間距（避免線條直接碰到星星），以及是否顯示名稱，並可透過「選擇星座...」對話框排除特定星座。這是獨立於深空天體／恆星標記之外的圖層，不受「選擇要顯示的物件...」或「移除所有標註」影響。</td></tr>
      <tr><td>1.36.0</td><td>疊圖方式：下拉選單中的「中位數」現已標示為「Median (Milky Way Mode)」（中位數／銀河模式），讓 Seestar 銀河模式建議選用的選項一眼可見。先前已儲存、值為純「Median」的舊設定檔仍可正確還原對應選項。下拉選單展開時，滑鼠停在各選項上也會各自彈出說明（先前僅收合狀態的下拉框本身有提示）。按鈕列重新編排：「匯出設定」已從頂端移到底部列，與「儲存檔案」及「關閉管線」並排，並新增「重設」按鈕——目前順序為：儲存檔案／匯出設定／重設／關閉管線。「重設」會將每個步驟的設定還原為預設值、清除所有預覽與復原紀錄，並提示重新選擇工作階段資料夾，方便在不關閉並重新開啟視窗的情況下開始全新的處理流程（會先要求確認）。</td></tr>
      <tr><td>1.35.0</td><td>修正：選擇中位數／加總疊圖時會當機，出現「Cannot upscale or maximize framing with median stacking. Disabling」，接著又出現「input images have different sizes. Stacking failed」。Siril 的 <code>-maximize</code> 版面配置（在疊圖時將每張影像補邊到聯集／最大畫布）僅平均模式支援——中位數與加總會直接拒絕此選項，一旦停用後就沒有任何機制能調和尺寸不一致的畫幅，導致疊圖失敗。現在只要選擇中位數或加總，套用對齊時就會改用 <code>-framing=min</code>（裁切至所有畫幅共同重疊區域）取代 <code>-framing=max</code>，確保畫幅尺寸一致，完全不需要 <code>-maximize</code>。取捨：中位數／加總的結果僅涵蓋所有畫幅共同重疊的區域，而非每張畫幅各自觸及的聯集範圍——平均模式仍保有較大的聯集畫布。選擇中位數或加總時，「羽化」、「重疊區域正規化」與「疊圖加權」現在都會自動變灰停用，因為這些選項皆不適用。</td></tr>
      <tr><td>1.34.0</td><td>修正：前置處理主要的對齊步驟在板解算失敗時（<code>Image ... did not solve</code>）先前沒有任何備援機制——這是實際會遇到的當機情形，例如 Seestar 銀河模式的視場遠比一般拍攝目標寬廣，Siril 天體測量解算器逐張處理時更容易失敗。只要本機設定了 Gaia 天體測量星表，對齊步驟就一律會執行 <code>seqplatesolve</code>，先前若失敗只會記錄警告並在對齊資料不完整甚至完全缺失的情況下繼續執行，導致後續步驟出錯。現在會在板解算失敗時自動退回一般星點比對式對齊（<code>register -2pass</code>），與「與現有主影像合併」功能自身對齊步驟已採用的備援方式一致。</td></tr>
      <tr><td>1.33.0</td><td>前置處理新增「疊圖方式」下拉選單——平均（拒絕演算法）／中位數／加總，預設為平均（拒絕演算法，與先前相同）。中位數適合 Seestar 銀河模式與其他容易出現衛星或飛機軌跡的大範圍拍攝，因為在只有少數畫幅出現軌跡時，中位數合成比 sigma-clip 拒絕演算法更能穩定將其消除。疊圖加權僅適用於平均模式，選擇中位數或加總時會自動變灰停用。</td></tr>

/* ---------- State + rendering ---------- */
let lang = "en";
let activeTab = "overview";

function setLang(l){
  lang = l;
  document.getElementById("btn-en").classList.toggle("active", l==="en");
  document.getElementById("btn-zh").classList.toggle("active", l==="zh");
  document.documentElement.lang = (l==="zh") ? "zh-Hant" : "en";
  renderAll();
}

function switchTab(id){
  activeTab = id;
  document.querySelectorAll("nav.tabs button").forEach(b=> b.classList.toggle("active", b.dataset.id === id));
  document.querySelectorAll(".panel").forEach(p=> p.classList.toggle("active", p.dataset.id === id));
  if(id === "overview"){ setTimeout(buildGraph, 0); }
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function buildTabsNav(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  const ov = document.createElement("button");
  ov.dataset.id = "overview";
  ov.innerHTML = `<span class="dot" style="background:#1c2033"></span><span>${UI[lang].overviewTab}</span>`;
  ov.onclick = ()=>switchTab("overview");
  nav.appendChild(ov);
  TOPICS.forEach(t=>{
    const b = document.createElement("button");
    b.dataset.id = t.id;
    b.innerHTML = `<span class="dot" style="background:${CLUSTER_HEX[t.cluster] || 'var(--accent)'}"></span><span>${t.title[lang]}</span>`;
    b.onclick = ()=>switchTab(t.id);
    nav.appendChild(b);
  });
}

function buildOverviewPanel(){
  const panel = el("div","panel");
  panel.dataset.id = "overview";
  const card = el("div","card");

  const shot = el("figure","hero-shot",
    `<img src="assets/screenshot.png" alt="S30 Pro Pipeline window showing the Remove Background stage with a live before/after split preview" loading="lazy">
     <figcaption>${UI[lang].heroShotCaption}</figcaption>`);
  card.appendChild(shot);

  card.appendChild(el("div", null, OVERVIEW.summary[lang]));

  const gwrap = el("div","graph-wrap");
  gwrap.innerHTML = `<svg id="network-graph"></svg>`;
  card.appendChild(gwrap);
  card.appendChild(el("p","graph-hint", UI[lang].graphHint));

  const legend = el("div","legend");
  Object.keys(LEGEND).forEach(c=>{
    legend.appendChild(el("span", null, `<i style="background:${CLUSTER_HEX[c]}"></i>${LEGEND[c][lang]}`));
  });
  card.appendChild(legend);

  panel.appendChild(card);
  return panel;
}

function buildTopicPanel(topic){
  const panel = el("div","panel");
  panel.dataset.id = topic.id;
  const card = el("div","card");
  card.appendChild(el("h2","topic-title",
    `<span class="badge" style="background:${CLUSTER_HEX[topic.cluster] || 'var(--accent)'}"></span>${topic.title[lang]}`));
  card.appendChild(el("div", null, topic.html[lang]));

  if(topic.references && topic.references.length){
    const details = el("details","refs");
    details.appendChild(el("summary", null, `${UI[lang].references} (${topic.references.length})`));
    const ol = el("ol");
    topic.references.forEach(r=> ol.appendChild(el("li", null, `<a href="${r.u}" target="_blank" rel="noopener">${r.t}</a>`)) );
    details.appendChild(ol);
    card.appendChild(details);
  }
  panel.appendChild(card);
  return panel;
}

function renderAll(){
  document.querySelectorAll("[data-i18n]").forEach(node=>{
    const key = node.getAttribute("data-i18n");
    if(UI[lang][key] !== undefined) node.textContent = UI[lang][key];
  });
  buildTabsNav();
  const content = document.getElementById("content");
  content.innerHTML = "";
  content.appendChild(buildOverviewPanel());
  TOPICS.forEach(t=> content.appendChild(buildTopicPanel(t)) );
  switchTab(activeTab);
}

/* ---------- D3 pipeline flowchart (static, wrapped left-to-right) ---------- */
function buildGraph(){
  const svgEl = document.getElementById("network-graph");
  if(!svgEl) return;
  svgEl.innerHTML = "";
  const wrapEl = svgEl.parentElement;
  const width = Math.max(320, (wrapEl && wrapEl.clientWidth) ||
    svgEl.getBoundingClientRect().width || 900) - 12;

  const nodes = FLOW_NODES.map(n => Object.assign({}, n));
  const links = FLOW_EDGES.map(([s,t]) => ({ source:s, target:t }));

  const boxW = 132, boxH = 46, gapX = 30, gapY = 44, pad = 26;
  const cols = Math.max(2, Math.min(nodes.length,
    Math.floor((width - pad*2 + gapX) / (boxW + gapX))));
  const rows = Math.ceil(nodes.length / cols);
  const height = pad*2 + rows*boxH + Math.max(0, rows-1)*gapY;

  // boustrophedon (snake) grid: row 0 left-to-right, row 1 right-to-left, etc.
  // — reads as a single continuous flowchart path instead of a scattered graph.
  nodes.forEach((d,i)=>{
    const row = Math.floor(i / cols);
    const ltr = row % 2 === 0;
    const posInRow = i % cols;
    const col = ltr ? posInRow : (cols - 1 - posInRow);
    d.row = row;
    d.ltr = ltr;
    d.cx = pad + boxW/2 + col*(boxW+gapX);
    d.cy = pad + boxH/2 + row*(boxH+gapY);
  });

  const svg = d3.select(svgEl)
    .attr("viewBox", [0,0,width,height])
    .attr("width", width).attr("height", height);

  svg.append("defs").append("marker")
    .attr("id","arrow").attr("viewBox","0 -5 10 10").attr("refX",9).attr("refY",0)
    .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
    .append("path").attr("d","M0,-5L10,0L0,5").attr("fill","#c7c9dd");

  const byId = {};
  nodes.forEach(n=> byId[n.id] = n);

  const linkG = svg.append("g");
  links.forEach(({source,target})=>{
    const a = byId[source], b = byId[target];
    if(!a || !b) return;
    let d;
    if(a.row === b.row){
      // same row: straight arrow between the facing edges of the two boxes
      const x1 = a.ltr ? a.cx + boxW/2 : a.cx - boxW/2;
      const x2 = a.ltr ? b.cx - boxW/2 : b.cx + boxW/2;
      d = `M${x1},${a.cy} L${x2},${b.cy}`;
    } else {
      // row wrap: elbow connector down from the bottom of a into the top of b
      const x1 = a.cx, y1 = a.cy + boxH/2;
      const x2 = b.cx, y2 = b.cy - boxH/2;
      const midY = (y1+y2)/2;
      d = `M${x1},${y1} L${x1},${midY} L${x2},${midY} L${x2},${y2}`;
    }
    linkG.append("path").attr("class","link").attr("d", d).attr("marker-end","url(#arrow)");
  });

  const node = svg.append("g").selectAll("g")
    .data(nodes).join("g").attr("class","node")
    .attr("transform", d=>`translate(${d.cx},${d.cy})`)
    .on("click", (event,d)=> switchTab(d.tab));

  node.append("rect")
    .attr("x", -boxW/2).attr("y", -boxH/2)
    .attr("width", boxW).attr("height", boxH)
    .attr("rx", 10).attr("ry", 10)
    .attr("fill", d=>CLUSTER_HEX[d.cluster] || "#4763ff");

  node.append("text").attr("class","node-label")
    .attr("text-anchor","middle").attr("dy","0.32em")
    .text(d=> d.label[lang]);

  node.append("title").text(d=> d.label[lang]);
}

/* ---------- Init ---------- */
setLang("en");
</script>
</body>
</html>
